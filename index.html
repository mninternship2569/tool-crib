<style>
:root{
  --graphite:#20242A;
  --steel:#343B44;
  --steel-light:#454E59;
  --paper:#F3EFE6;
  --paper-card:#FFFDF8;
  --ink:#23262B;
  --ink-soft:#6B7078;
  --amber:#E8871E;
  --amber-deep:#C96A0C;
  --hazard:#C0392B;
  --hazard-bg:#FBE7E4;
  --ok:#3F7D5C;
  --ok-bg:#E3EFE7;
  --line-green:#06C755;
  --border:#DCD5C4;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans Thai','IBM Plex Mono',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3,.display{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ===== Shell ===== */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--graphite);
  color:#EDEAE2;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;
}
.brand-tag{
  width:34px;height:34px;border-radius:7px;
  background:var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;color:#20242A;font-size:15px;
  transform:rotate(-4deg);
  box-shadow:0 2px 0 rgba(0,0,0,0.25);
}
.brand-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px;}
.brand-sub{font-size:11px;color:#A9ABA0;margin-top:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.5px;}
.nav{padding:14px 12px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:8px;
  color:#C7C9C0;font-size:14px;font-weight:500;
  margin-bottom:2px;position:relative;
  transition:background .12s ease, color .12s ease;
}
.nav-item .ic{width:18px;text-align:center;font-size:15px;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--amber);color:#20242A;font-weight:600;}
.nav-item .badge{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:rgba(255,255,255,0.12);padding:2px 6px;border-radius:20px;color:#fff;
}
.nav-item.active .badge{background:rgba(0,0,0,0.18);color:#20242A;}
.nav-item.alert .badge{background:var(--hazard);color:#fff;}
.sidebar-foot{
  padding:14px 20px 18px;font-size:11px;color:#83867E;
  border-top:1px solid rgba(255,255,255,0.08);
  font-family:'IBM Plex Mono',monospace;
}
.main{flex:1;min-width:0;padding:26px 34px 60px;}
.topbar{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:22px;flex-wrap:wrap;gap:14px;
}
.page-title{font-size:24px;font-weight:700;margin:0 0 4px;}
.page-sub{color:var(--ink-soft);font-size:13.5px;margin:0;}

/* ===== Cards / stats ===== */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px;}
.stat-card{
  background:var(--paper-card);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber);
}
.stat-card.hazard::before{background:var(--hazard);}
.stat-card.ok::before{background:var(--ok);}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1;}
.stat-label{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:500;}

.panel{
  background:var(--paper-card);border:1px solid var(--border);border-radius:12px;
  padding:20px 22px;margin-bottom:20px;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.panel-title{font-size:15.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px;}

/* ===== Buttons ===== */
.btn{
  border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:translateY(1px);}
.btn-amber{background:var(--amber);color:#20242A;}
.btn-amber:hover{filter:brightness(1.06);}
.btn-dark{background:var(--graphite);color:#fff;}
.btn-dark:hover{filter:brightness(1.15);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-soft);}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:6px 8px;}
.btn-ghost:hover{color:var(--ink);}
.btn-danger{background:var(--hazard-bg);color:var(--hazard);}
.btn-danger:hover{filter:brightness(0.97);}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-line{background:var(--line-green);color:#fff;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

/* ===== Inputs ===== */
label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:5px;}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;
  font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);}
.field{margin-bottom:13px;}
.field-row{display:grid;gap:12px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:1fr 1fr 1fr;}

/* ===== Search ===== */
.search-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search-bar input{max-width:280px;}
.chip{
  padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;
  border:1.5px solid var(--border);color:var(--ink-soft);background:#fff;
}
.chip.active{background:var(--graphite);color:#fff;border-color:var(--graphite);}

/* ===== Tool tag cards ===== */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.tag-card{
  background:var(--paper-card);border:1.5px solid var(--border);border-radius:10px;
  padding:14px 13px 12px;position:relative;transition:box-shadow .15s ease, border-color .15s ease;
}
.tag-card:hover{border-color:var(--amber);box-shadow:0 4px 14px rgba(0,0,0,0.07);}
.tag-hole{
  width:14px;height:14px;border-radius:50%;background:var(--paper);
  border:1.5px solid var(--border);position:absolute;top:10px;right:10px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.15);
}
.tag-thumb{
  width:100%;height:88px;border-radius:7px;margin-bottom:9px;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  background-size:cover;background-position:center;
}
.tag-code{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.4px;}
.tag-name{font-size:13.5px;font-weight:700;margin:3px 0 2px;line-height:1.3;min-height:35px;}
.tag-brand{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.tag-foot{display:flex;justify-content:space-between;align-items:center;}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.status-pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;}
.status-pill.normal{background:var(--ok-bg);color:var(--ok);}
.status-pill.damaged{background:var(--hazard-bg);color:var(--hazard);}
.status-pill.out{background:#FFF1D6;color:var(--amber-deep);}

/* ===== Table ===== */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
  color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--border);font-weight:700;
}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:rgba(232,135,30,0.04);}

/* ===== Modal ===== */
.overlay{
  position:fixed;inset:0;background:rgba(32,36,42,0.55);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
}
.modal{
  background:#fff;border-radius:14px;max-width:560px;width:100%;padding:24px 26px 26px;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.modal.wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-title{font-size:17px;font-weight:700;margin:0;}
.close-x{background:none;border:none;font-size:18px;color:var(--ink-soft);padding:4px 8px;border-radius:6px;}
.close-x:hover{background:var(--paper);}

/* ===== Requisition slip ===== */
.slip{
  background:#fff;border:2px solid var(--ink);border-radius:2px;padding:26px 28px;position:relative;
}
.slip-header{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;}
.slip-header h2{margin:0 0 3px;font-size:19px;letter-spacing:0.3px;}
.slip-header .co{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
.slip-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:12px;}
.slip table{border:1px solid var(--ink);}
.slip th,.slip td{border:1px solid var(--ink);font-size:12px;padding:6px 8px;}
.slip th{background:#EDEAE2;text-transform:none;letter-spacing:0;}
.slip-sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12.5px;}
.slip-sign .ln{border-top:1px solid var(--ink);width:170px;text-align:center;padding-top:4px;margin-top:34px;}

/* ===== Requisition item row ===== */
.item-row{display:grid;grid-template-columns:2fr 90px 90px 36px;gap:8px;align-items:end;margin-bottom:9px;}

/* ===== Overdue banner list ===== */
.overdue-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;border-radius:9px;background:var(--hazard-bg);margin-bottom:8px;flex-wrap:wrap;gap:8px;
}
.overdue-row .info{font-size:13px;}
.overdue-row .info b{display:block;font-size:13.5px;}
.overdue-row .days{font-family:'IBM Plex Mono',monospace;color:var(--hazard);font-weight:700;font-size:12px;}

/* ===== Empty state ===== */
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty .ic{font-size:34px;margin-bottom:8px;}

/* ===== Toast ===== */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--graphite);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;
  opacity:0;transition:all .25s ease;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.3);pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.help-box{
  background:#FFF7EA;border:1.5px solid #F0D8A8;border-radius:10px;padding:14px 16px;font-size:12.5px;
  line-height:1.6;color:#5C4415;margin-bottom:16px;
}
.help-box b{color:#3D2E0C;}
.thumb-upload{
  border:2px dashed var(--border);border-radius:9px;padding:16px;text-align:center;font-size:12.5px;
  color:var(--ink-soft);cursor:pointer;background:var(--paper);
}
.thumb-upload:hover{border-color:var(--amber);}
.small-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

/* ===== User badge / logout ===== */
.user-badge{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;background:var(--paper);border:1.5px solid var(--border);}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#20242A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0;}
.user-avatar.admin{background:var(--graphite);color:#fff;}
.user-badge .uname{font-size:12.5px;font-weight:600;line-height:1.15;}
.user-badge .urole{font-size:10px;color:var(--ink-soft);}

/* ===== Bottom mobile nav ===== */
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--graphite);padding:6px 4px 8px;
  box-shadow:0 -6px 18px rgba(0,0,0,0.25);
}
.bottom-nav .bn-row{display:flex;justify-content:space-around;}
.bottom-nav .bn-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:#B9BBB2;font-size:10px;font-weight:600;padding:6px 4px;border-radius:9px;flex:1;position:relative;
}
.bottom-nav .bn-item.active{color:var(--amber);}
.bottom-nav .bn-item .ic{font-size:19px;}
.bottom-nav .bn-item .dot{position:absolute;top:2px;right:22%;width:8px;height:8px;border-radius:50%;background:var(--hazard);border:1.5px solid var(--graphite);}

/* ===== Login screen ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--graphite);padding:24px 16px;}
.login-card{background:var(--paper-card);border-radius:18px;padding:30px 26px 26px;max-width:400px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,0.4);}
.login-brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:20px;}
.login-brand .brand-tag{width:44px;height:44px;font-size:18px;margin-bottom:10px;}
.login-brand h2{margin:0 0 3px;font-size:19px;}
.login-brand p{margin:0;font-size:12px;color:var(--ink-soft);}
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0;max-height:340px;overflow-y:auto;}
.staff-btn{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 8px 12px;text-align:center;}
.staff-btn:active{transform:scale(0.97);}
.staff-btn .avatar{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#20242A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;margin:0 auto 7px;}
.staff-btn.admin .avatar{background:var(--graphite);color:#fff;}
.staff-btn .sname{font-size:12.5px;font-weight:700;line-height:1.25;}
.staff-btn .srole{font-size:9.5px;color:var(--ink-soft);margin-top:2px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--border);}
.pin-dot.filled{background:var(--amber);border-color:var(--amber);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:14px auto 0;}
.pin-pad button{padding:15px 0;font-size:18px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-weight:700;}
.pin-pad button:active{background:var(--paper);}

.install-banner{
  display:flex;align-items:center;gap:10px;background:#FFF7EA;border:1.5px solid #F0D8A8;
  border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:12px;color:#5C4415;line-height:1.5;
}
.install-banner .ic{font-size:20px;flex-shrink:0;}
.install-banner button{background:var(--amber);color:#20242A;border:none;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;flex-shrink:0;}
.install-banner .x{background:none;color:#8a7038;font-size:15px;padding:2px 4px;}

@media(max-width:900px){
  .sidebar{display:none;}
  .bottom-nav{display:block;}
  .main{padding:14px 14px 90px;}
  .item-row{grid-template-columns:1fr;}
  .field-row.cols-2,.field-row.cols-3{grid-template-columns:1fr;}
}
@media(max-width:520px){
  .topbar{flex-direction:column;align-items:stretch;}
  .modal{padding:18px 16px 20px;}
  .staff-grid{grid-template-columns:repeat(2,1fr);}
}

@media print{
  .sidebar,.topbar,.bottom-nav,.no-print{display:none !important;}
  .main{padding:0;}
  body{background:#fff;}
}

  return SEED_RAW.map((r,i)=>({
    id:'t_'+r[0],
    code:r[0], name:r[1], brand:r[2], asset:r[3],

/* ===== persistence =====
   window.storage (used earlier) only exists inside the claude.ai artifact
   viewer — now that this file runs standalone on GitHub Pages, that API
   doesn't exist at all, which is why data silently failed to save/share
   before. This version talks to a small Apps Script + Google Sheet
   backend (see DataStore.gs) for shared data, and keeps a local cache in
   localStorage so the app still works offline / before backend is set up.
*/
function seedStaff(){
  return [{id:'st_admin', name:'ผู้ดูแลระบบ', pin:'0000', role:'admin'}];
}
function lsGet(key){ try{ const v = localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage full/unavailable */ } }

let BACKEND_OK = false; // true once we've confirmed we can reach API_URL

async function apiGetAll(){
  if(!API_URL) return null;
  const res = await fetch(API_URL + '?action=getAll', {method:'GET'});
  if(!res.ok) throw new Error('bad response');
  return await res.json(); // { "tools-blob": "...", "checkouts-blob": "...", "staff-directory-blob": "..." }
}
async function apiSet(key, valueObj){
  if(!API_URL) return false;
  try{
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({key, value: JSON.stringify(valueObj)})
    });
    return true;
  }catch(e){
    return false;
  }
}

async function loadAll(){
  let remote = null;
  if(API_URL){
    try{
      remote = await apiGetAll();
      BACKEND_OK = true;
    }catch(e){
      BACKEND_OK = false;
      toast('เชื่อมต่อฐานข้อมูลกลางไม่ได้ — ใช้ข้อมูลสำรองในเครื่องนี้ไปก่อน ⚠️');
    }
  }
  TOOLS = remote && remote['tools-blob'] ? JSON.parse(remote['tools-blob']) : (lsGet('tools-blob') || seedTools());
  CHECKOUTS = remote && remote['checkouts-blob'] ? JSON.parse(remote['checkouts-blob']) : (lsGet('checkouts-blob') || []);
  STAFF = remote && remote['staff-directory-blob'] ? JSON.parse(remote['staff-directory-blob']) : (lsGet('staff-directory-blob') || seedStaff());
  lsSet('tools-blob', TOOLS); lsSet('checkouts-blob', CHECKOUTS); lsSet('staff-directory-blob', STAFF);
  // session is per-device by nature — always local, never synced to the shared backend
  SESSION = lsGet('my-session');
  if(SESSION && !STAFF.some(s=>s.id===SESSION.id)) SESSION = null;
}
async function saveTools(){
  lsSet('tools-blob', TOOLS);
  const ok = await apiSet('tools-blob', TOOLS);
  if(API_URL && !ok) toast('บันทึกสต๊อกไปที่เซิร์ฟเวอร์ไม่สำเร็จ (เก็บไว้ในเครื่องนี้ก่อน) ⚠️');
}
async function saveCheckouts(){
  lsSet('checkouts-blob', CHECKOUTS);
  const ok = await apiSet('checkouts-blob', CHECKOUTS);
  if(API_URL && !ok) toast('บันทึกรายการเบิกไปที่เซิร์ฟเวอร์ไม่สำเร็จ (เก็บไว้ในเครื่องนี้ก่อน) ⚠️');
}
async function saveStaff(){
  lsSet('staff-directory-blob', STAFF);
  const ok = await apiSet('staff-directory-blob', STAFF);
  if(API_URL && !ok) toast('บันทึกรายชื่อผู้ใช้งานไปที่เซิร์ฟเวอร์ไม่สำเร็จ (เก็บไว้ในเครื่องนี้ก่อน) ⚠️');
}
async function saveSession(){
  if(SESSION) lsSet('my-session', SESSION);
  else { try{ localStorage.removeItem('my-session'); }catch(e){} }
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>el.classList.remove('show'), 2600);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'});
}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
function isAdmin(){ return !!SESSION && SESSION.role==='admin'; }

const NAV = [
  {id:'dashboard', label:'แดชบอร์ด', icon:'📊'},
  {id:'inventory', label:'คลังเครื่องมือ', icon:'🗄️'},
  {id:'checkout', label:'ใบเบิกเครื่องมือ', icon:'📝'},
  {id:'history', label:'ประวัติ / คืนเครื่องมือ', icon:'🔁'},
  {id:'settings', label:'จัดการระบบ', icon:'⚙️', adminOnly:true},
];
let ROUTE = 'dashboard';

function visibleNav(){ return NAV.filter(n=> !n.adminOnly || isAdmin()); }

function renderNav(){
  const overdue = getOverdue().length;
  document.getElementById('navList').innerHTML = visibleNav().map(n=>`
    <div class="nav-item ${ROUTE===n.id?'active':''} ${n.id==='dashboard'&&overdue>0?'alert':''}" onclick="go('${n.id}')">
      <span class="ic">${n.icon}</span><span>${n.label}</span>
      ${n.id==='inventory'?`<span class="badge">${TOOLS.length}</span>`:''}
      ${n.id==='dashboard'&&overdue>0?`<span class="badge">${overdue}</span>`:''}
      ${n.id==='checkout'&&getOpenCheckouts().length>0?`<span class="badge">${getOpenCheckouts().length}</span>`:''}
    </div>`).join('');
  renderBottomNav(overdue);
}
function renderBottomNav(overdue){
  const el = document.getElementById('bottomNav');
  if(!el) return;
  overdue = overdue===undefined ? getOverdue().length : overdue;
  el.innerHTML = `<div class="bn-row">${visibleNav().map(n=>`
    <div class="bn-item ${ROUTE===n.id?'active':''}" onclick="go('${n.id}')">
      <span class="ic">${n.icon}</span><span>${n.label.replace('ใบเบิกเครื่องมือ','ใบเบิก').replace('ประวัติ / คืนเครื่องมือ','ประวัติ').replace('คลังเครื่องมือ','คลัง')}</span>
      ${n.id==='dashboard'&&overdue>0?`<span class="dot"></span>`:''}
    </div>`).join('')}</div>`;
}
function go(id){ ROUTE = id; render(); window.scrollTo(0,0); }

function getOpenCheckouts(){ return CHECKOUTS.filter(c=>c.status==='out'); }
function getOverdue(){
  const t = todayStr();
  return CHECKOUTS.filter(c=>c.status==='out' && c.dueDate && c.dueDate < t);
}
function availableQty(toolId){
  const tool = TOOLS.find(t=>t.id===toolId);
  if(!tool) return 0;
  const out = CHECKOUTS.filter(c=>c.status==='out').reduce((sum,c)=>{
    const item = c.items.find(i=>i.toolId===toolId);
    return sum + (item?item.qty:0);
  },0);
  return Math.max(0, tool.qty - out);
}

let DEFERRED_INSTALL = null;
let INSTALL_DISMISSED = false;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  DEFERRED_INSTALL = e;
  if(!SESSION) renderLoginBody();
});
window.addEventListener('appinstalled', ()=>{ DEFERRED_INSTALL = null; toast('ติดตั้งแอปเรียบร้อย ✅'); });

async function loadInstallDismissed(){
  INSTALL_DISMISSED = !!lsGet('install-hint-dismissed');
}
async function dismissInstallHint(){
  INSTALL_DISMISSED = true;
  lsSet('install-hint-dismissed', true);
  renderLoginBody();
}
async function triggerInstall(){
  if(!DEFERRED_INSTALL) return;
  DEFERRED_INSTALL.prompt();
  await DEFERRED_INSTALL.userChoice;
  DEFERRED_INSTALL = null;
  renderLoginBody();
}
function installBannerHtml(){
  if(isStandalone() || INSTALL_DISMISSED) return '';
  if(DEFERRED_INSTALL){
    return `<div class="install-banner">
      <span class="ic">📲</span>
      <span style="flex:1;">ติดตั้งแอปนี้ไว้ที่หน้าจอโฮมมือถือ เปิดใช้งานได้เร็วเหมือนแอปทั่วไป</span>
      <button onclick="triggerInstall()">ติดตั้ง</button>
      <button class="x" onclick="dismissInstallHint()">✕</button>
    </div>`;
  }
  if(isIOS()){
    return `<div class="install-banner">
      <span class="ic">📲</span>
      <span style="flex:1;">เพิ่มไปยังหน้าจอโฮม: แตะปุ่ม แชร์ <b>Share</b> ด้านล่าง แล้วเลือก <b>"เพิ่มไปที่หน้าจอโฮม"</b></span>

  return '';
}

    body.innerHTML = `

    `;
  } else {

    if(!s.pin){
      // no PIN required — shouldn't normally reach here since pickStaff logs in directly
      body.innerHTML = '';
      return;
    }
    body.innerHTML = `
      <button class="btn btn-ghost btn-sm" onclick="LOGIN_PICK=null;LOGIN_PIN='';renderLoginBody();">← กลับ</button>
      <div style="text-align:center;margin-top:6px;">

        <div style="font-weight:700;font-size:14px;">${esc(s.name)}</div>

      </div>
      <div class="pin-dots">
        ${[0,1,2,3].map(i=>`<div class="pin-dot ${LOGIN_PIN.length>i?'filled':''}"></div>`).join('')}
      </div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join('')}
        <button onclick="pinPress('back')">⌫</button>
        <button onclick="pinPress('0')">0</button>
        <div></div>
      </div>
    `;
  }
}
function pickStaff(id){
  const s = STAFF.find(x=>x.id===id);
  if(!s) return;
  if(!s.pin){ doLogin(s); return; }
  LOGIN_PICK = s; LOGIN_PIN='';
  renderLoginBody();
}
async function pinPress(key){
  if(key==='back'){ LOGIN_PIN = LOGIN_PIN.slice(0,-1); renderLoginBody(); return; }
  if(LOGIN_PIN.length>=4) return;
  LOGIN_PIN += key;
  renderLoginBody();
  if(LOGIN_PIN.length===4){
    if(LOGIN_PIN===LOGIN_PICK.pin){
      const s = LOGIN_PICK;
      LOGIN_PICK=null; LOGIN_PIN='';
      await doLogin(s);
    } else {
      setTimeout(()=>{ toast('รหัส PIN ไม่ถูกต้อง ⚠️'); LOGIN_PIN=''; renderLoginBody(); }, 180);
    }
  }
}
async function doLogin(s){
  SESSION = {id:s.id, name:s.name, role:s.role};
  await saveSession();
  ROUTE='dashboard';
  render();
  toast(`ยินดีต้อนรับ ${s.name} ✅`);
}

  </div>` : '';

  return `
  ${backendWarning}
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">รายการเครื่องมือทั้งหมด</div></div>

function statusBadge(c){
  if(c.status==='returned') return `<span class="status-pill normal">คืนแล้ว</span>`;
  const t = todayStr();
  if(c.dueDate && c.dueDate < t) return `<span class="status-pill damaged">เกินกำหนด</span>`;
  return `<span class="status-pill out">ยืมอยู่</span>`;
}

function nextCode(){
  const nums = TOOLS.map(t=>parseInt((t.code||'').replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  const max = nums.length?Math.max(...nums):0;
  return 'MN'+String(max+1).padStart(3,'0');
}
function handleImageUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 320;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg',0.8);
      const box = document.getElementById('thumbUpload');
      box.style.backgroundImage = `url('${dataUrl}')`;
      box.style.backgroundSize='cover'; box.style.backgroundPosition='center';
      box.style.height='110px'; box.style.color='#fff'; box.style.textShadow='0 1px 4px rgba(0,0,0,0.6)';
      box.textContent='เปลี่ยนรูปภาพ';
      box.dataset.img = dataUrl;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function saveTool(id){
  const code = document.getElementById('f_code').value.trim();
  const name = document.getElementById('f_name').value.trim();
  if(!code || !name){ toast('กรุณากรอกรหัสและชื่อเครื่องมือ'); return; }
  const box = document.getElementById('thumbUpload');
  const imgData = box.dataset.img || null;
  const data = {
    code, name,
    brand: document.getElementById('f_brand').value.trim(),
    asset: document.getElementById('f_asset').value.trim(),
    qty: Math.max(1, parseInt(document.getElementById('f_qty').value)||1),
    price: parseFloat(document.getElementById('f_price').value)||0,
    status: document.getElementById('f_status').value,
    date: document.getElementById('f_date').value.trim(),
    note: document.getElementById('f_note').value.trim(),
  };
  if(id){
    const t = TOOLS.find(x=>x.id===id);
    Object.assign(t,data);
    if(imgData) t.image = imgData;
  } else {
    TOOLS.push({id:'t_'+code+'_'+Date.now(), ...data, image: imgData});
  }
  await saveTools();
  closeModal(); render();
  toast('บันทึกเครื่องมือเรียบร้อย ✅');
}
async function deleteTool(id){

  TOOLS = TOOLS.filter(t=>t.id!==id);

  toast('ลบรายการแล้ว');
}

async function submitCheckout(){
  const borrower = document.getElementById('co_borrower').value.trim();
  const approver = document.getElementById('co_approver').value.trim();
  const date = document.getElementById('co_date').value;
  const dueDate = document.getElementById('co_due').value;
  const job = document.getElementById('co_job').value.trim();
  const items = DRAFT_ITEMS.filter(i=>i.toolId).map(i=>{
    const t = TOOLS.find(x=>x.id===i.toolId);
    return {toolId:i.toolId, code:t.code, name:t.name, qty:i.qty};
  });
  if(!borrower || !approver){ toast('กรุณากรอกชื่อผู้เบิกและผู้อนุมัติ'); return; }
  if(items.length===0){ toast('กรุณาเลือกเครื่องมืออย่างน้อย 1 รายการ'); return; }
  if(!dueDate){ toast('กรุณาระบุกำหนดคืน'); return; }
  const rec = {
    id: 'co_'+Date.now(), date, dueDate, borrower, approver, job,
    items, status:'out', returnedDate:null, notifiedAt:null
  };
  CHECKOUTS.push(rec);
  await saveCheckouts();
  closeModal(); render();
  toast('บันทึกใบเบิกเรียบร้อย ✅');
}

function openStaffModal(id){
  const editing = !!id;
  const s = editing ? STAFF.find(x=>x.id===id) : {id:'', name:'', pin:'', role:'tech'};
  const html = `
  <div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h3 class="modal-title">${editing?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งานใหม่'}</h3>
        <button class="close-x" onclick="closeModal()">✕</button>
      </div>
      <div class="field"><label>ชื่อ-นามสกุล</label><input type="text" id="st_name" value="${esc(s.name)}" placeholder="เช่น สมชาย ใจดี"></div>
      <div class="field-row cols-2">
        <div class="field"><label>สิทธิ์การใช้งาน</label>
          <select id="st_role">
            <option value="tech" ${s.role==='tech'?'selected':''}>ช่าง</option>
            <option value="admin" ${s.role==='admin'?'selected':''}>ผู้ดูแลระบบ</option>
          </select>
        </div>
        <div class="field"><label>PIN 4 หลัก (เว้นว่าง = ไม่ใช้ PIN)</label><input type="text" id="st_pin" maxlength="4" value="${esc(s.pin)}" placeholder="เช่น 1234"></div>
      </div>
      <p class="small-note">ผู้ที่มีสิทธิ์ “ผู้ดูแลระบบ” จะสามารถแก้ไขคลังเครื่องมือ จัดการผู้ใช้งาน และสำรองข้อมูลได้ แนะนำให้ตั้ง PIN ไว้ด้วย</p>
      <div style="display:flex;justify-content:space-between;margin-top:16px;">
        <div>${editing&&STAFF.length>1?`<button class="btn btn-danger btn-sm" onclick="deleteStaff('${s.id}')">🗑️ ลบผู้ใช้งาน</button>`:''}</div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button>
          <button class="btn btn-amber" onclick="saveStaffForm('${s.id}')">บันทึก</button>
        </div>
      </div>
    </div>
  </div>`;
  showModal(html);
}
async function saveStaffForm(id){
  const name = document.getElementById('st_name').value.trim();
  if(!name){ toast('กรุณากรอกชื่อ'); return; }
  const role = document.getElementById('st_role').value;
  const pin = document.getElementById('st_pin').value.trim().replace(/\D/g,'').slice(0,4);
  if(pin && pin.length!==4){ toast('PIN ต้องมี 4 หลัก หรือเว้นว่างไว้'); return; }
  if(id){
    const s = STAFF.find(x=>x.id===id);
    Object.assign(s,{name, role, pin});
    if(SESSION && SESSION.id===id) SESSION.name=name, SESSION.role=role;
  } else {
    STAFF.push({id:'st_'+Date.now(), name, role, pin});
  }
  await saveStaff();
  if(SESSION) await saveSession();
  closeModal(); render();
  toast('บันทึกผู้ใช้งานเรียบร้อย ✅');
}
async function deleteStaff(id){
  if(STAFF.length<=1){ toast('ต้องมีผู้ใช้งานอย่างน้อย 1 คน'); return; }
  if(!confirm('ยืนยันการลบผู้ใช้งานนี้?')) return;
  STAFF = STAFF.filter(s=>s.id!==id);
  await saveStaff();
  closeModal(); render();
  toast('ลบผู้ใช้งานแล้ว');
}

function exportData(){
  const blob = new Blob([JSON.stringify({tools:TOOLS, checkouts:CHECKOUTS, staff:STAFF}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'unilamp-tool-crib-backup-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('ส่งออกข้อมูลแล้ว');
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(data.tools) TOOLS = data.tools;
      if(data.checkouts) CHECKOUTS = data.checkouts;
      if(data.staff) STAFF = data.staff;
      await saveTools(); await saveCheckouts(); await saveStaff();
      render();
      toast('นำเข้าข้อมูลเรียบร้อย ✅');
    }catch(err){ toast('ไฟล์ไม่ถูกต้อง ⚠️'); }
  };
  reader.readAsText(file);
}

/* =========================================================
   MODAL
   ========================================================= */
function showModal(html){
  closeModal();
  const div = document.createElement('div');
  div.id='modalRoot';
  div.innerHTML = html;
  document.body.appendChild(div);
}
function closeModal(){
  const el = document.getElementById('modalRoot');
  if(el) el.remove();
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await loadAll();
  await loadInstallDismissed();
  render();
  // best-effort service worker registration (enables "Install app" on Android/Chrome
  // when this file is hosted over HTTPS on its own URL; harmless no-op otherwise)
  if('serviceWorker' in navigator){
    try{
      const swCode = "self.addEventListener('fetch',function(e){});";
      const swUrl = URL.createObjectURL(new Blob([swCode], {type:'application/javascript'}));
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }catch(e){ /* not supported in this context — safe to ignore */ }
  }
})();
</script>
